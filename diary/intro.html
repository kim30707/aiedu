<!doctype html>
<!--
  셈제작소 공통틀 v1 — 홍보 A4 2장
  형식: A4 세로 · 2쪽 · 컬러 · 그림 중심
사용법
  학교·기관에 PDF로 보내거나 컬러 인쇄하는 홍보지. 1쪽 = 이름·핵심 한 줄·큰 그림·핵심 숫자 3칸·왜 3개, 2쪽 = 수업 흐름 그림·배우는 것·학교 준비·접수 4단계·연락처.
  채울 것: name·oneLine·status·image(없으면 기본 그림)·grades·visit·size·why(3)·flow(4~8)·learn(4)·prep(4)·apply(4)·phone·site·email·price.
  그림 칸(.hero-art)은 쪽 면적의 40% 안팎을 유지한다. 실제 사진·앱 화면으로 바꿀 때 image에 상대경로(img/파일.jpg)를 넣는다.
  공통: 1) 아래 <script id="program-data"> JSON만 바꾼다(키 이름은 그대로). 2) 같은 폴더에 logo/ 를 둔다.
        3) 주소 끝에 #slots 를 붙이면 예시 대신 {{자리표시}}가 보인다. 4) 인쇄는 브라우저 인쇄 → 여백 없음·배경 그래픽 켬,
        또는 node 점검.cjs 이파일.html 로 PDF·캡처·넘침 확인. 5) 문구 규칙은 README.md(미완성 문구 금지·AI 표기·숫자 근거).
자리표시({{이름}}=JSON 키)
  {{접수상태}}=status · {{프로그램명}}=name · {{핵심한줄}}=oneLine · {{대표그림}}=image · {{대상학년}}=grades · {{방문형태}}=visit · {{학급규모}}=size · {{왜}}=why · {{전화번호}}=phone · {{홈페이지주소}}=site · {{흐름_핵심한줄}}=flowLine · {{흐름}}=flow · {{배우는것}}=learn · {{학교준비물}}=prep · {{AI입력방식}}=aiMode · {{접수단계}}=apply · {{가격}}=price
  [전화번호] [팩스번호] [가격] [홈페이지 주소] [이메일] — 값이 정해질 때까지 대괄호 그대로 둔다.
-->
<html lang="ko">
<head>
<meta name="robots" content="noindex">
<link rel="icon" href="logo/semjejakso_mark_small.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 꿈 다이어리 · 홍보 A4 2장 · 셈제작소</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== 셈제작소 공통 토큰 (컬러 2안 · Noto Sans KR + IBM Plex Mono) ===== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0b7a75; --teal-dk:#085e5a; --teal-lt:#d6ecea; --teal-line:#a9d3cf;
  --coral:#e8562f; --coral-dk:#b8401d; --coral-lt:#fde4dc;
  --yellow:#ffd166; --yellow-lt:#fff4d6;
  --mint:#f3faf8; --ink:#10221f; --ink-2:#3d524e; --line:#cfe3df; --white:#fff;
  --f:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --m:'IBM Plex Mono','Noto Sans KR',ui-monospace,monospace;
}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:var(--f);color:var(--ink);background:#e4edeb;word-break:keep-all;overflow-wrap:break-word;line-height:1.45;font-weight:400}
.mono{font-family:var(--m);letter-spacing:.02em}
img{display:block;max-width:100%}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
b,strong{font-weight:700}

/* 브랜드 */
.brand{display:flex;align-items:center;gap:.5em;line-height:1.05}
.brand img{width:2.2em;height:2.2em}
.brand b{display:block;font-weight:900;font-size:1em;letter-spacing:-.01em}
.brand span{display:block;font-weight:500;font-size:.62em;color:var(--ink-2);margin-top:.18em}
.brand.on-dark span{color:#fff}
.brand.on-dark b{color:#fff}

/* 공통 부품 */
.pill{display:inline-flex;align-items:center;gap:.45em;border-radius:999px;padding:.38em .9em;font-weight:700;line-height:1.2}
.status{background:var(--yellow);color:var(--ink)}
.status .dot{width:.6em;height:.6em;border-radius:50%;background:var(--coral);display:inline-block}
.chip{display:inline-flex;align-items:center;gap:.45em;border-radius:999px;padding:.35em .85em;background:var(--white);border:1.5px solid var(--line);font-weight:500;line-height:1.2}
.chip svg.i{color:var(--teal)}
.label{font-family:var(--m);font-weight:600;font-size:.78em;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}
.one{font-weight:800}
.bead{display:inline-grid;place-items:center;border-radius:50%;background:var(--teal);color:#fff;font-family:var(--m);font-weight:600;flex:none}
.bead.ai{background:var(--coral)}
.card{background:var(--white);border:1.5px solid var(--line);border-radius:18px}
.qr{display:grid;place-items:center;border:2px dashed var(--teal-line);border-radius:12px;color:var(--teal);font-family:var(--m);font-weight:600;background:#fff}

/* 주판 흐름(가로) — 공통 */
.rod{position:relative;display:flex}
.rod::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:4px;background:var(--teal);opacity:.35}
.rod .step{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.rod .part{visibility:hidden;font-family:var(--m);font-weight:600;color:var(--teal-dk);white-space:nowrap}
.rod .step.grp-start .part{visibility:visible}
.rod .step.grp-start::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px dashed var(--teal-line)}
.rod .step:first-child::before{display:none}

/* 화면 보기 · 자리표시 모드 */
.slots [data-slot-label]{position:relative}
.slots [data-slot-label]::after{content:"{{" attr(data-slot-label) "}}";position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font:600 13px var(--m);padding:3px 8px;border-radius:6px}

/* 고정 크기 쪽(슬라이드·A4) */
.slide{width:1280px;height:720px;overflow:hidden;position:relative;margin:24px auto;box-shadow:0 6px 24px rgba(16,34,31,.14);background:var(--mint)}
.page{width:210mm;height:297mm;overflow:hidden;position:relative;margin:24px auto;box-shadow:0 6px 24px rgba(16,34,31,.14);background:#fff}
@media print{
  body{background:none}
  .slide,.page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .slide:last-of-type,.page:last-of-type{break-after:auto;page-break-after:auto}
  .noprint{display:none!important}
}

@page{size:A4;margin:0}
/* ===== 이 틀 전용 ===== */
.page{padding:0}
.p-head{display:flex;justify-content:space-between;align-items:center;padding:30px 40px 0}
.p-head .brand{font-size:21px}
.p-head .status{font-size:15px}
/* 1쪽 */
.hero{margin:22px 40px 0;border-radius:26px;background:var(--teal);color:#fff;height:585px;position:relative;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.hero .txt{padding:34px 38px 0}
.hero .lbl{font:600 13px var(--m);letter-spacing:.1em;color:var(--yellow-lt)}
.hero h1{font-size:54px;font-weight:900;letter-spacing:-.035em;line-height:1.1;margin-top:8px;text-wrap:balance}
.hero .one{font-size:22px;color:var(--yellow);margin-top:10px;line-height:1.35}
.hero-art{margin:18px 30px 0;border-radius:20px 20px 0 0;background:var(--mint);display:grid;place-items:center;overflow:hidden;position:relative}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-art img+.art-svg{display:none}
.hero-art .art-svg{height:94%;width:auto;margin-top:8px}
.facts3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 40px 0}
.facts3 .f{display:flex;gap:12px;align-items:center;padding:16px 16px;border-radius:16px;background:var(--mint);border:1.5px solid var(--line)}
.facts3 .ic{width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.facts3 .k{font:600 11px var(--m);color:var(--teal);letter-spacing:.08em}
.facts3 .v{font-size:15px;font-weight:800;line-height:1.3}
.why-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 40px 0}
.why-row .w{text-align:center;padding:0 6px}
.why-row .ic{width:76px;height:76px;margin:0 auto;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-size:38px}
.why-row .w:nth-child(2) .ic{background:var(--coral);color:#fff}
.why-row h3{font-size:19px;font-weight:900;margin-top:10px}
.why-row p{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.45}
.foot1{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:26px;padding:0 40px;font-size:16px;font-weight:700}
.foot1 span{display:inline-flex;align-items:center;gap:8px}
.foot1 svg{color:var(--yellow);font-size:20px}
.foot1 .status{margin-left:auto;font-size:14px}
/* 2쪽 */
.p2-title{padding:22px 40px 0}
.p2-title h2{font-size:30px;font-weight:900;letter-spacing:-.02em}
.p2-title .one{font-size:16px;color:var(--teal-dk);font-weight:700;margin-top:2px}
.p2{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin:18px 40px 0}
.sec-h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;color:var(--teal-dk);margin-bottom:12px}
.sec-h svg{font-size:20px}
.vrod{position:relative;padding-left:0}
.vrod::before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--teal);opacity:.3}
.vrod .vs{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;position:relative;margin-bottom:9px}
.vrod .bead{width:44px;height:44px;font-size:17px;border:3px solid #fff;box-sizing:content-box;margin-left:-2px}
.vrod .bead.ai{background:var(--coral-dk)}
.vrod .vt{background:var(--mint);border-radius:12px;padding:8px 12px;border:1.5px solid var(--line)}
.vrod .is-ai .vt{background:var(--coral-lt);border-color:#f5b9a6}
.vrod .vt b{font-size:15px;font-weight:800;display:block;line-height:1.3}
.vrod .vt span{font:600 11.5px var(--m);color:var(--teal-dk)}
.vrod .is-ai .vt span{color:var(--coral-dk)}
.vrod .grp{display:none;font:600 12px var(--m);color:var(--teal-dk);margin:2px 0 6px 58px}
.vrod .grp-start .grp{display:block}
.learn .l{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:14.5px;font-weight:700;line-height:1.4}
.learn .bead{width:28px;height:28px;font-size:13px;background:var(--yellow);color:var(--ink)}
.prepb{margin-top:16px;background:var(--mint);border-radius:16px;padding:16px 18px;border:1.5px solid var(--line)}
.prepb .l{display:flex;gap:8px;font-size:13.5px;line-height:1.4;margin-bottom:7px;font-weight:500}
.prepb .l svg{color:var(--teal);font-size:18px;margin-top:1px}
.aim{margin-top:14px;border:2px solid var(--coral);border-radius:14px;padding:12px 14px;display:flex;gap:10px;font-size:13px;line-height:1.45;font-weight:500}
.aim svg{font-size:24px;color:var(--coral-dk)}
.apply4{position:absolute;left:40px;right:40px;bottom:136px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.apply4 .a{position:relative}
.apply4 .bead{width:40px;height:40px;font-size:16px}
.apply4 .a:nth-child(4) .bead{background:var(--coral-dk)}
.apply4 .a:not(:nth-child(4))::after{content:"";position:absolute;left:50px;right:-6px;top:19px;height:3px;background:var(--teal);opacity:.3;border-radius:3px}
.apply4 h4{font-size:16px;font-weight:900;margin-top:8px}
.apply4 p{font-size:12px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.contact2{position:absolute;left:40px;right:40px;bottom:30px;height:90px;border-radius:18px;background:var(--teal);color:#fff;display:grid;grid-template-columns:1fr 1fr 1fr 74px;align-items:center;gap:12px;padding:0 10px 0 24px}
.contact2 .c{display:flex;gap:9px;align-items:center}
.contact2 svg{font-size:24px;color:var(--yellow)}
.contact2 .k{font:600 10.5px var(--m);color:var(--yellow-lt);letter-spacing:.06em}
.contact2 .v{font-size:15px;font-weight:800}
.contact2 .qr{width:70px;height:70px;font-size:12px;border:0}
</style>

<style>/* 다이어리 전용: 수업료 두 형태 나란히 */
.pricebox{margin-top:10px;border:2px solid var(--teal);border-radius:16px;padding:9px 12px;background:#fff}
.pricebox .sec-h{margin:0 0 6px;font-size:16px}
.pr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr2 .p{background:var(--mint);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.pr2 .t{font-size:12px;font-weight:800;color:var(--teal)}.pr2 b{font-size:22px;font-weight:900;line-height:1.15;color:var(--ink)}
.pr2 .u{font-size:11.5px;color:var(--ink-2)}.pr2 .f{margin-top:3px;font-size:12px;font-weight:700;color:var(--ink);background:var(--yellow-lt);border-radius:6px;padding:2px 6px;align-self:flex-start}
.pricebox .pn{margin:6px 0 0;font-size:10.5px;letter-spacing:-.02em;line-height:1.5;color:var(--ink-2)}
</style>
</head>

<script>
/* 셈제작소 공통틀 채움 스크립트 — 고치지 말고 위의 program-data JSON만 바꾼다.
   data-k="키"            : 글자를 채움 (점으로 깊이: lesson.goal, 목록 안에서는 항목 기준 키, "."=항목 자체, "#"=번호, "##"=두 자리 번호)
   data-attr="src|href"   : 글자 대신 속성을 채움 (data-pre="앞붙임")
   data-if / data-ifnot   : 값이 있을 때만 / 없을 때만 남김
   data-opt               : 값이 없으면 그 칸을 지움
   <template data-each="flow" data-max="8" data-group="part"> : 목록 반복
   주소 끝에 #slots      : 예시 대신 {{자리표시}}를 보여 줌 */
(function(){
  var D = JSON.parse(document.getElementById('program-data').textContent);
  var SLOT = {"name": "프로그램명", "short": "짧은이름", "oneLine": "핵심한줄", "tagline": "소개문장", "subject": "교과", "grades": "대상학년", "time": "수업시간", "visit": "방문형태", "team": "진행인력", "size": "학급규모", "devices": "준비기기", "aiMode": "AI입력방식", "status": "접수상태", "phone": "전화번호", "fax": "팩스번호", "email": "이메일", "price": "가격", "site": "홈페이지주소", "image": "대표그림", "whyLine": "왜_핵심한줄", "why": "왜", "flowLine": "흐름_핵심한줄", "flow": "흐름", "learn": "배우는것", "prepLine": "준비_핵심한줄", "prep": "학교준비물", "kit": "강사지참물", "apply": "접수단계", "lesson.goal": "오늘할일", "lesson.inputBy": "AI입력자", "lesson.rules": "약속", "lesson.activities": "활동", "lesson.promptFrame": "요청문틀", "lesson.checks": "확인질문", "lesson.present.min": "발표시간", "lesson.present.points": "발표내용", "lesson.aiDid": "AI가한일", "lesson.weDid": "우리가판단한일", "lesson.wrap": "마무리", "sessions": "차시표", "standards": "성취기준", "observe": "관찰항목", "task.title": "과제명", "task.intro": "과제설명", "task.steps": "과제단계", "task.checks": "확인칸", "lesson.activities.0.title": "활동1제목", "lesson.activities.0.min": "활동1시간", "lesson.activities.0.steps": "활동1단계", "lesson.activities.0.tip": "활동1도움말", "lesson.activities.1.title": "활동2제목", "lesson.activities.1.min": "활동2시간", "lesson.activities.1.steps": "활동2단계", "lesson.activities.1.tip": "활동2도움말", "lesson.activities.2.title": "활동3제목", "lesson.activities.2.min": "활동3시간", "lesson.activities.2.steps": "활동3단계", "lesson.activities.2.tip": "활동3도움말"};
  var SUB = {"title": "제목", "desc": "설명", "min": "시간", "who": "누가", "part": "교시", "icon": "아이콘", "code": "코드", "text": "내용", "link": "이수업에서", "item": "항목", "good": "잘함", "mid": "보통", "help": "도움필요", "no": "차시", "goal": "배울것", "activity": "활동", "ai": "AI사용", "check": "확인방법", "label": "칸이름", "hint": "칸도움말", "steps": "단계", "tip": "도움말", ".": "항목"};
  var showSlots = /slots/.test(location.hash + location.search);
  if (showSlots) document.documentElement.classList.add('slots');
  function get(o, p){ if (p === '.') return o; return p.split('.').reduce(function(a,k){ return a == null ? undefined : a[k]; }, o); }
  function slotName(path){
    if (SLOT[path]) return SLOT[path];
    var m = path.split('[].'); if (m.length > 1){ var last = m[m.length-1]; return (SLOT[m.slice(0,-1).join('[].')] || m[0]) + '·' + (SUB[last] || last); }
    return path;
  }
  function str(v){ if (v == null) return ''; if (Array.isArray(v)) return v.join(' · '); if (typeof v === 'object') return v.text || v.label || v.booking || ''; return String(v); }
  function fill(scope, data, prefix, idx){
    scope.querySelectorAll('[data-if],[data-ifnot]').forEach(function(el){
      var k = el.getAttribute('data-if'), n = el.getAttribute('data-ifnot');
      if (showSlots && (k === 'image' || n === 'image')) { if (k) el.remove(); return; }
      if (k !== null && !get(data, k)) el.remove();
      if (n !== null && get(data, n)) el.remove();
    });
    scope.querySelectorAll('[data-k]').forEach(function(el){
      var p = el.getAttribute('data-k');
      if (p === '#' || p === '##'){ var num = (idx||0) + 1; el.textContent = p === '##' && num < 10 ? '0' + num : num; return; }
      var v = get(data, p), at = el.getAttribute('data-attr'), full = prefix ? prefix + '[].' + p : p;
      if (p === '.') full = prefix;
      if (at){ if (!showSlots && v) el.setAttribute(at, (el.getAttribute('data-pre') || '') + v); return; }
      if (showSlots){ el.textContent = '{{' + slotName(full) + '}}'; return; }
      if (v == null || v === '' || (Array.isArray(v) && !v.length)){ if (el.hasAttribute('data-opt')) { var box = el.closest('[data-opt-box]') || el; box.remove(); } else el.textContent = ''; return; }
      el.textContent = str(v);
    });
    scope.querySelectorAll('[data-cls]').forEach(function(el){
      el.getAttribute('data-cls').split(',').forEach(function(pair){ var kv = pair.split(':'); if (get(data, kv[0])) el.classList.add(kv[1]); });
    });
    scope.querySelectorAll('template[data-each]').forEach(function(t){
      var key = t.getAttribute('data-each'), list = get(data, key) || [];
      var max = +t.getAttribute('data-max') || list.length, grp = t.getAttribute('data-group');
      var path = prefix ? prefix + '[].' + key : key;
      if (!Array.isArray(list)) list = [];
      if (showSlots) list = list.slice(0, Math.max(1, Math.min(2, list.length)));
      var prev = {};
      list.slice(0, max).forEach(function(item, i){
        var frag = t.content.cloneNode(true);
        var first = frag.firstElementChild;
        if (grp && first && (i === 0 || get(item, grp) !== get(prev, grp))) first.classList.add('grp-start');
        fill(frag, item, path, i);
        t.parentNode.insertBefore(frag, t);
        prev = item;
      });
      if (!list.length && t.hasAttribute('data-opt')){ var box = t.closest('[data-opt-box]'); if (box) box.remove(); }
    });
  }
  fill(document, D, '', 0);
  if (typeof window.afterFill === 'function') window.afterFill(D, showSlots);
  document.documentElement.setAttribute('data-filled', '1');
})();
</script>
